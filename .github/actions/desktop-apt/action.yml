name: Install Linux desktop runtime packages
description: >-
  Installs the GTK/WebKitGTK packages the Linux desktop build and smoke need, through a .deb cache keyed by
  runner image version and this file.

runs:
  using: composite
  steps:
    - id: image
      shell: bash
      run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      with:
        path: ~/.cache/desktop-apt
        key: desktop-apt-${{ steps.image.outputs.version }}-${{ hashFiles('.github/actions/desktop-apt/action.yml') }}
    - shell: bash
      run: |
        cache=~/.cache/desktop-apt
        mkdir -p "$cache/partial"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$cache" \
          dbus-x11 x11-utils xvfb libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2
        sudo chown -R "$(id -u):$(id -g)" "$cache"
